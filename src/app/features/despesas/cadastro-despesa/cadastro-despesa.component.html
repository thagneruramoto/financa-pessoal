<div class="container">
  <div class="form-despesa">
    <h1>Cadastro de Despesa</h1>
    <form [formGroup]="form" (ngSubmit)="inserir()">
      <input pInputText formControlName="descricao" type="text" placeholder="Descrição" />
      @if (form.controls.descricao.hasError('required') && form.controls.descricao.touched) {
      <p-message severity="error" variant="simple" size="small">Informe a descrição da despesa</p-message>
      }
      <p-inputnumber mode="currency" inputId="currency-germany" currency="BRL" locale="pt-BR" formControlName="valor" placeholder="Valor" />
      <p-select formControlName="tipo" optionLabel="nome" optionValue="id" [options]="tipos()" [loading]="loading()" placeholder="Tipo">
        <ng-template #footer>
          <div class="p-3">
            <p-button label="Adicionar Receita" fluid severity="secondary" text size="small" icon="pi pi-plus" />
          </div>
        </ng-template>
      </p-select>
      <p-button label="Inserir" type="submit" [disabled]="form.invalid" />
    </form>
  </div>
  <app-lista-despesa />
</div>
