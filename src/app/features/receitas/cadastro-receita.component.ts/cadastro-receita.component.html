<div class="container">
  <div class="form-receita">
    <h1>Cadastro de Receita</h1>
    <form [formGroup]="form" (ngSubmit)="inserir()">
      <input pInputText formControlName="descricao" type="text" placeholder="Descrição" />
      @if (form.controls.descricao.hasError('required') && form.controls.descricao.touched) {
      <p-message severity="error" variant="simple" size="small">Informe a descrição da receita</p-message>
      }
      <p-inputnumber mode="currency" inputId="currency-germany" currency="BRL" locale="pt-BR" formControlName="valor" placeholder="Valor" />
      <p-select formControlName="tipo" optionLabel="nome" optionValue="id" [options]="tipos()" [loading]="loading()" placeholder="Tipo">
        <ng-template #footer>
          <div class="p-3">
            <p-button label="Adicionar novo tipo" (click)="showDialog()" fluid severity="secondary" text size="small" icon="pi pi-plus" />
            <p-dialog header="Criar novo tipo" [modal]="true" [(visible)]="visibleDialog" [style]="{ width: '25rem' }">
              <span>Insira o novo tipo de receita.</span>
              <div>
                <input pInputText #receita placeholder="Escreva aqui o novo tipo de receita." autocomplete="off" />
              </div>
              <div>
                <p-button label="Cancel" severity="secondary" (click)="visibleDialog.set(false)" />
                <p-button label="Save" (click)="salvarNewTipo(receita.value)"  />
              </div>
            </p-dialog>
          </div>
        </ng-template>
      </p-select>
      <p-button label="Inserir" type="submit" [disabled]="form.invalid" />
    </form>
  </div>
</div>
